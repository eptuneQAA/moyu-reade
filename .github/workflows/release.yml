name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck web frontend
        run: npm run typecheck

      - name: Check build dependencies
        run: dpkg-checkbuilddeps

      - name: Check tag matches debian/changelog
        run: |
          version="$(dpkg-parsechangelog -S Version)"
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::tag ${tag} 与 debian/changelog 的版本 ${version} 不一致"
            exit 1
          fi

      - name: Build deb
        run: ./scripts/build-deb.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" \
            release/*.deb \
            release/SHA256SUMS \
            --title "moyu ${TAG}" \
            --generate-notes
