name: build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev fakeroot

      - name: Show build environment
        run: |
          node -v
          npm -v
          dpkg-buildpackage --version | head -n 1
          dpkg-query -W -f='${Package} ${Version}\n' debhelper dpkg-dev fakeroot

      - name: Check build dependencies
        run: |
          {
            echo '### Build dependencies'
            echo '```'
            dpkg-query -W -f='${Package} ${Version}\n' debhelper dpkg-dev fakeroot || true
            echo '---'
            dpkg-checkbuilddeps 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build deb
        env:
          MOYU_SKIP_TESTS: '1'
          MOYU_DPKG_FLAGS: '-d'
        run: bash -x ./scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: moyu-deb
          path: |
            release/*.deb
            release/SHA256SUMS

      - name: Publish latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            release/*.deb \
            release/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "moyu latest" \
            --notes "由 main 分支最新提交 ${GITHUB_SHA} 自动构建。" \
            --prerelease
