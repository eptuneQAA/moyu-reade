name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 同一分支的新推送取消旧的运行，省 Actions 时间
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试与类型检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck web frontend
        run: npm run typecheck

      - name: Build TUI bundle and web assets
        run: npm run build:all

  package:
    name: 构建 deb
    needs: test
    # PR 只跑测试，不打包
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev fakeroot

      - name: Check build dependencies
        run: |
          {
            echo '### Build dependencies'
            echo '```'
            dpkg-query -W -f='${Package} ${Version}\n' debhelper dpkg-dev fakeroot || true
            echo '---'
            dpkg-checkbuilddeps 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 依赖装齐就应该通过：失败让流水线红掉，而不是用 -d 掩盖
          dpkg-checkbuilddeps

      - name: Install dependencies
        run: npm ci

      - name: Build deb
        env:
          # 测试已在 test 作业跑过，这里只打包
          MOYU_SKIP_TESTS: '1'
        run: bash -x ./scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: moyu-deb
          path: |
            release/*.deb
            release/SHA256SUMS

      - name: Publish latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            release/*.deb \
            release/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "moyu latest" \
            --notes "由 main 分支最新提交 ${GITHUB_SHA} 自动构建。" \
            --prerelease
